  <title>KERDEX Beta 3.0 — Prévia offline</title>
<style>/* KERDEX Beta 3.0 — responsive design system. User-provided 2026 brand board. */
:root{
  --green-950:#052F24;--green-900:#082F25;--green-800:#124837;--green-700:#176647;
  --lime:#C8F35A;--lime-green:#16C060;--charcoal:#1F2937;
  --bg:#F6F8F5;--surface:#fff;--surface-2:#F0F4EF;--surface-3:#E8F0E9;
  --text:#142A20;--text-2:#597065;--muted:#7B8C82;--stroke:#DFE8DF;
  --positive:#138352;--negative:#AE493E;--focus:#62942E;
  --shadow:0 8px 34px rgb(10 43 32 / 3.5%);--shadow-lg:0 22px 80px rgb(7 37 28 / 11%);
  --radius:17px;--page-max:1460px;--sidebar-width:244px;
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#091E17;--surface:#102E24;--surface-2:#15392C;--surface-3:#204536;
  --text:#ECF4EF;--text-2:#B9D0BF;--muted:#9EBAAA;--stroke:#295143;
  --positive:#8BE3A9;--negative:#FAA99B;--focus:#C8F35A;
  --shadow:0 8px 34px rgb(0 0 0 / 11%);--shadow-lg:0 22px 80px rgb(0 0 0 / 25%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:28px}
body{margin:0;min-width:300px;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit;text-decoration:none}
button,input,select{outline-offset:3px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus)}
button{-webkit-tap-highlight-color:transparent}button svg{flex-shrink:0}
h1,h2,h3,h4,p{margin-top:0}h1,h2,h3{line-height:1.16;letter-spacing:-.032em}h1{font-size:clamp(29px,3.4vw,45px);font-weight:750;margin-bottom:12px}h2{font-size:20px;font-weight:740}h3{font-size:17px}p{color:var(--text-2)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;z-index:1000;top:-100px;left:16px;padding:12px 20px;background:#fff;color:#052F24;border-radius:8px}.skip-link:focus{top:15px}
.icon{display:inline-block;vertical-align:middle;flex-shrink:0}
.startup{display:grid;min-height:100vh;place-content:center;text-align:center;justify-items:center;gap:12px}.startup img{border-radius:16px}
.app-shell{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100vh}
/* Vertical product navigation */
.sidebar{background:var(--green-950);color:#EAF8EE;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:25px 15px 19px;overflow:auto;overscroll-behavior:contain;z-index:20}
.sidebar-logo{display:flex;align-items:center;width:100%;border:0;color:#fff;background:transparent;padding:4px 12px 24px;text-align:left}
.wordmark{display:inline-flex;align-items:center;gap:12px;white-space:nowrap}.wordmark img{object-fit:contain;max-width:none}.wordmark>span{font-size:23px;letter-spacing:.055em;font-weight:820;line-height:1}.wordmark-compact>span{font-size:17px}.wordmark-compact img{width:29px;height:34px}
.side-label{font-size:10px;font-weight:750;letter-spacing:.17em;color:#7EAA96;padding:16px 15px 10px;display:flex;justify-content:space-between}.side-label span{letter-spacing:0;font-size:10px;color:#91B6A4}
.side-nav{display:grid;gap:5px}.side-item{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:10px;padding:12px 13px;min-height:46px;text-align:left;color:#BDDACB;background:transparent;font-size:13.5px;font-weight:600;transition:background .17s,color .17s}
.side-item:hover{background:#154B38;color:#fff}.side-item.selected{color:#fff;background:#205441}.side-item.selected svg{color:var(--lime)}.side-item .active-marker{position:absolute;right:0;height:22px;width:3px;border-radius:4px;background:var(--lime)}
.sidebar-spacer{flex:1;min-height:35px}.sidebar-card{border:1px solid #285C46;background:linear-gradient(148deg,#174E3B,#0A392B);border-radius:14px;padding:17px 14px;margin:0 1px 19px}
.sidebar-card-icon{color:var(--lime);margin-bottom:8px}.side-mini-title{font-weight:750;font-size:14px;color:#fff}.sidebar-card p{color:#A9C7B7;font-size:12px;line-height:1.65;margin:7px 0 0}.side-mini-line{height:1px;background:#315B47;margin:15px 0 10px}.sidebar-card>span{color:#7FAD95;font-size:10px;letter-spacing:.08em}
.sidebar-bottom{border-top:1px solid #27543F;padding:17px 10px 0;display:flex;align-items:center;gap:10px}.sidebar-bottom img{border-radius:8px}.sidebar-bottom strong,.sidebar-bottom small{display:block}.sidebar-bottom strong{font-size:12px;letter-spacing:.07em}.sidebar-bottom small{font-size:10px;color:#9CC1AE;line-height:1.8}
/* Main shell */
.main-column{min-width:0}.topbar{height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,3vw,48px);background:var(--surface);border-bottom:1px solid var(--stroke);gap:16px}
.topbar-context{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--muted);white-space:nowrap}.topbar-context strong{color:var(--text);font-weight:650}.topbar-indicator{width:8px;height:8px;border-radius:50%;background:var(--lime-green);box-shadow:0 0 0 4px #16c0601e}.topbar-slash{color:#9EAD9F}
.topbar-right{display:flex;align-items:center;gap:17px}.demo-pill{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:12px;border:1px solid var(--stroke);border-radius:30px;padding:8px 13px;background:var(--bg)}.demo-pill svg{color:var(--positive)}
.lang-select{display:flex;align-items:center;gap:6px;color:var(--text-2);cursor:pointer}.lang-select select{cursor:pointer;color:var(--text);appearance:none;border:0;background:transparent;font-size:12px;font-weight:700;outline-offset:2px}.mobile-brand{display:none;background:none;border:0;color:var(--text)}
.main-content{max-width:var(--page-max);margin-inline:auto;min-width:0;padding:clamp(24px,2.8vw,42px) clamp(20px,3vw,48px) 20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.page-head h1{max-width:780px}.page-subtitle{font-size:14px;color:var(--text-2);margin:0;max-width:720px}.eyebrow{font-weight:780;font-size:10px;letter-spacing:.2em;color:var(--green-700);text-transform:uppercase;margin-bottom:12px}:root[data-theme="dark"] .eyebrow{color:var(--lime)}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.button{border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 17px;min-height:43px;font-size:13px;font-weight:730;white-space:nowrap;border:1px solid transparent;transition:background-color .15s,transform .15s,border-color .15s}
.button:active{transform:translateY(1px)}.button-primary{color:#fff;background:var(--green-950)}.button-primary:hover{background:#176647}.button-lime{background:var(--lime);color:#092D22}.button-lime:hover{background:#DCFF89}.button-secondary{background:var(--surface);color:var(--text);border-color:var(--stroke)}.button-secondary:hover{background:var(--surface-2)}.button-danger{color:#B42318;border:1px solid #EDC4C1;background:transparent}.button-danger:hover{background:#FBEDEA}:root[data-theme="dark"] .button-danger{color:#FDAA9F;border-color:#84483F}.button-outline-light{color:#fff;border-color:#568F72;background:transparent}.button-outline-light:hover{background:#ffffff17}
.period-control{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);padding:0 12px;min-height:43px;white-space:nowrap}.period-control select{appearance:none;border:0;background:transparent;min-width:110px;max-width:155px;color:var(--text);font-weight:650;font-size:13px;padding:10px 0;outline-offset:1px;cursor:pointer}
.card{min-width:0;border:1px solid var(--stroke);border-radius:var(--radius);background:var(--surface);padding:22px;box-shadow:var(--shadow)}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metric-card{min-height:149px;position:relative;overflow:hidden}.metric-card::after{content:"";position:absolute;top:0;left:24px;right:24px;height:2px;background:linear-gradient(90deg,var(--lime),transparent);opacity:.65}.metric-label{color:var(--text-2);font-size:12px;font-weight:680}.metric-value{color:var(--text);font-size:clamp(22px,2.25vw,32px);font-weight:780;letter-spacing:-.036em;margin:16px 0 10px;overflow-wrap:anywhere}.positive{color:var(--positive)!important}.negative{color:var(--negative)!important}.metric-caption{color:var(--muted);font-size:11px;max-width:330px;line-height:1.45}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.section-head h2{margin:0;font-size:16px}.badge{display:inline-flex;border-radius:30px;min-height:23px;align-items:center;justify-content:center;padding:4px 9px;letter-spacing:.02em;font-size:10px;font-weight:710;color:var(--text-2);background:var(--surface-2)}.badge-success{background:#e5f7ec;color:#197848}
.text-link{color:var(--green-700);border:0;background:none;padding:4px 0;display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:12px}:root[data-theme="dark"] .text-link{color:var(--lime)}.text-link:hover{text-decoration:underline}
.welcome-strip{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;border-radius:11px;background:var(--surface-2);padding:12px 16px;margin-bottom:18px;font-size:11px;color:var(--text-2)}.welcome-orbit{display:flex;align-items:center;gap:8px;color:var(--green-700);font-weight:740}:root[data-theme="dark"] .welcome-orbit{color:var(--lime)}
.dashboard-main,.dashboard-lower{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;margin-top:16px;align-items:stretch}
/* Data visualization */
.chart-area{min-height:206px;height:206px;display:flex;justify-content:space-around;align-items:flex-end;gap:8px;padding:8px 4px 0;position:relative;border-bottom:1px solid var(--stroke);background:repeating-linear-gradient(to top,transparent,transparent 49px,var(--stroke) 50px,transparent 51px)}
.chart-group{flex:1;max-width:75px;min-width:24px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:11px}.chart-bars{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:calc(100% - 32px);width:100%}.chart-bar{width:20px;max-width:36%;border-radius:6px 6px 0 0;min-height:2px;transition:height .4s ease}.bar-income{background:#128754}.bar-expense{background:var(--lime)}.chart-group small{font-size:11px;color:var(--muted);height:20px}.chart-legend{display:flex;gap:20px;margin-top:15px;font-size:11px;color:var(--text-2)}.chart-legend>span{display:inline-flex;align-items:center;gap:7px}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px}.income-dot{background:#128754}.expense-dot{background:var(--lime)}
.progress-track{width:100%;height:7px;border-radius:10px;overflow:hidden;background:var(--surface-3);margin-top:11px}.progress-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#0E9964,#56CA66);border-radius:10px;transition:width .35s}.progress-complete{background:#1B9863}.progress-caption{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;color:var(--muted);font-size:11px}.progress-caption strong{color:var(--positive)}
.compact-goal{padding:10px 0 16px;border-bottom:1px solid var(--stroke)}.compact-goal:first-of-type{padding-top:2px}.compact-goal:last-of-type{border-bottom:0;padding-bottom:0}.compact-line{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:690}.compact-line strong{color:var(--positive)}.compact-goal .progress-track{margin-top:10px}.compact-goal small{display:block;margin-top:8px;color:var(--muted);font-size:10px}
.transaction-list{display:grid}.transaction-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--stroke);min-width:0}.transaction-row:last-child{border-bottom:0}.transaction-icon{width:37px;height:37px;flex-shrink:0;display:grid;place-items:center;border-radius:11px}.transaction-icon.income{color:#14925F;background:#e4f6ea}.transaction-icon.expense{color:#647C6C;background:var(--surface-2)}:root[data-theme="dark"] .transaction-icon.income{background:#204f38;color:#9CEAAD}.transaction-info{flex:1;min-width:0}.transaction-info strong{display:block;font-size:12.5px;font-weight:710;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.transaction-info span{display:block;color:var(--muted);font-size:10.5px;margin-top:4px}.transaction-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}.transaction-end>strong{font-size:12.5px;white-space:nowrap}.row-actions{display:flex;gap:4px}.row-actions button,.item-actions button{border:1px solid transparent;background:transparent;color:var(--text-2);padding:6px;border-radius:7px;display:grid;place-items:center}.row-actions button:hover,.item-actions button:hover{background:var(--surface-2);border-color:var(--stroke)}
.quick-copy{font-size:12px;margin:-4px 0 20px}.quick-button-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick-button-grid button{border-radius:11px;padding:16px 12px;background:var(--surface-2);color:var(--text);border:1px solid var(--stroke);display:grid;grid-template-columns:auto 1fr auto;text-align:left;align-items:center;gap:8px;font-size:11px;font-weight:680}.quick-button-grid button svg:first-child{color:var(--green-700)}.quick-button-grid button:hover{border-color:#8FAF9B;background:var(--surface-3)}.quick-button-grid button span{min-width:0;overflow-wrap:anywhere}
.cashflow-line{margin-bottom:20px}.cashflow-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px;color:var(--text-2)}.cashflow-label strong{color:var(--text)}.cashflow-track,.category-track{height:9px;border-radius:30px;background:var(--surface-2);overflow:hidden}.cashflow-fill,.category-track span{display:block;width:0;height:100%;border-radius:inherit}.positive-bg{background:#198B58}.lime-bg{background:var(--lime)}.result-band{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--stroke);padding-top:14px;font-size:12px}.result-band strong{font-size:16px}
/* Finance list, filters */

.news-topics{display:grid;gap:8px;margin-top:20px}.news-topic{display:flex;align-items:center;gap:10px;border:1px solid var(--stroke);background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:12px;cursor:pointer}.news-topic input{accent-color:#23865A;width:17px;height:17px}

</script><script>/** Financial calculation functions. Monetary values are integer centavos (BRL). */
window.KX = window.KX || {};
KX.Finance = Object.freeze({
  parseCents(value) {
    // HTML type=number submits ASCII decimals regardless of visual locale.
    const text = String(value ?? '').trim().replace(',', '.');
    if (!/^(?:\d{1,10})(?:\.\d{1,2})?$/.test(text)) return null;
    const [whole, fractional=''] = text.split('.');
    const cents = Number(whole)*100 + Number((fractional+'00').slice(0,2));
    return Number.isSafeInteger(cents) && cents >= 0 && cents <= 100000000000 ? cents : null;
  },
  inputAmount(cents) { return (cents / 100).toFixed(2); },
  money(cents, locale='pt-BR') {
    return new Intl.NumberFormat(locale, {style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}).format(cents/100);
  },
  dateISO(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; },
  monthKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`; },
  monthShift(month, offset) {
    const [year,number]=month.split('-').map(Number);
    return this.monthKey(new Date(year, number-1+offset,1));
  },
  monthLabel(month,locale='pt-BR',short=false){
    const [y,m] = month.split('-').map(Number);
    return new Intl.DateTimeFormat(locale,{month:short?'short':'long',year:short?undefined:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1)));
  },
  dateLabel(iso,locale='pt-BR') {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '—';
    const [y,m,d]=iso.split('-').map(Number);
    return new Intl.DateTimeFormat(locale,{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));
  },
  totals(transactions,month){
    const sums={income:0,expense:0,net:0};
    for(const row of transactions){if(row.date.slice(0,7)!==month)continue;sums[row.type]+=row.cents;}
    sums.net=sums.income-sums.expense;return sums;
  },
  history(transactions,month,n=6){
    return Array.from({length:n},(_,i)=>{const key=this.monthShift(month,i-n+1);return {key,...this.totals(transactions,key)};});
  },
  progress(saved,target){return target>0?Math.min(100,Math.round(saved/target*100)):0;},
  monthsToGoal(saved,target,monthly){return saved>=target?0:monthly>0?Math.ceil((target-saved)/monthly):null;},
  projectedLabel(saved,target,monthly,locale='pt-BR'){
    const months=this.monthsToGoal(saved,target,monthly);
    if(months===null)return null;
    const now=new Date();
    const d=new Date(now.getFullYear(),now.getMonth()+months,1);
    return new Intl.DateTimeFormat(locale,{month:'short',year:'numeric'}).format(d);
  },
  categoryTotals(transactions,month){
    const map=new Map();
    for(const row of transactions){if(row.type!=='expense'||row.date.slice(0,7)!==month)continue;map.set(row.category,(map.get(row.category)||0)+row.cents);}
    return [...map].map(([category,cents])=>({category,cents})).sort((a,b)=>b.cents-a.cents);
  },

function demoSeed(){
  const today=new Date();const tx=[];let id=1;
  const types=[
    ['Salário',540000,'income','work',5],
    ['Aluguel',155000,'expense','housing',7],
    ['Supermercado',69500,'expense','food',11],
    ['Transporte',32000,'expense','transport',15],
    ['Contas e serviços',27800,'expense','other',19],
    ['Projeto extra',47000,'income','work',20],
    ['Lazer',18900,'expense','leisure',22]
  ];
  for(let offset=-5;offset<=0;offset++){
    const stamp=new Date(today.getFullYear(),today.getMonth()+offset,1);
    const multiplier=1+((offset+5)%3-1)*.055;
    for(const [name,amount,type,category,day] of types){
      if(offset===0&&day>Math.max(today.getDate(),20))continue;
      tx.push({id:id++,name,cents:Math.round(amount*multiplier),type,category,date:F.dateISO(new Date(stamp.getFullYear(),stamp.getMonth(),day))});
    }
  }
  return {transactions:tx,purchases:[{id:101,name:'Notebook para estudos',cents:460000,saved:140000,monthly:55000,priority:'high'},{id:102,name:'Novo smartphone',cents:280000,saved:72000,monthly:30000,priority:'medium'}],goals:[{id:201,name:'Reserva de emergência',cents:1500000,saved:625000,priority:'high'},{id:202,name:'Viagem especial',cents:600000,saved:248000,priority:'medium'}]};

function checkTransaction(x){return x&&Number.isSafeInteger(x.id)&&typeof x.name==='string'&&x.name.length<=80&&safeInteger(x.cents)&&x.cents>0&&['income','expense'].includes(x.type)&&CATEGORIES.includes(x.category)&&F.validateDate(x.date);}
function checkPurchase(x){return x&&Number.isSafeInteger(x.id)&&typeof x.name==='string'&&x.name.length<=80&&safeInteger(x.cents)&&x.cents>0&&safeInteger(x.saved)&&x.saved<=x.cents&&safeInteger(x.monthly)&&['high','medium','low'].includes(x.priority);}
function checkGoal(x){return x&&Number.isSafeInteger(x.id)&&typeof x.name==='string'&&x.name.length<=80&&safeInteger(x.cents)&&x.cents>0&&safeInteger(x.saved)&&x.saved<=x.cents&&(!x.priority||['high','medium','low'].includes(x.priority));}

      if(s.remember)localStorage.setItem(DEMO_KEY,JSON.stringify({transactions:s.transactions,purchases:s.purchases,goals:s.goals}));

  remove(kind,id){const key={transaction:'transactions',purchase:'purchases',goal:'goals'}[kind];if(!key)return;KX.state[key]=KX.state[key].filter(x=>x.id!==id);this.persist();}

function simulator(){
 return `<div class="feature-page advanced-simulator">${U.head('KERDEX / '+t('navSimulator'),t('simAdvancedTitle'),t('simAdvancedSubtitle'))}
 <section class="card"><div class="section-head"><h2>${e(t('simAssumptions'))}</h2>${ico('calculator')}</div>${simForm()}<div class="sim-fx-bar">${simParams.currency!=='BRL'?button(t('simFxFetch'),'data-fx-fetch','button-secondary','globe'):''}<span class="muted-small">${e(t('simFxDaily'))}</span></div><div id="advanced-sim-error" role="alert" class="sim-error" hidden></div></section>${resultView()}</div>`;
}
function closeDialog(){document.getElementById('asset-dialog')?.close()}
function showAsset(id){
 let d=document.getElementById('asset-dialog');if(!d){d=document.createElement('dialog');d.id='asset-dialog';d.className='entry-dialog asset-dialog';document.body.appendChild(d);d.addEventListener('click',ev=>{if(ev.target.closest('[data-asset-close]'))closeDialog()});d.addEventListener('submit',saveAsset)}
 const item=s.portfolio.find(x=>x.id===id)||{id:0,ticker:'',name:'',type:'stock',currency:'BRL',quantity:1,avgCost:0,price:0,fx:1,purchaseFx:1,dividends:0};
 const field=(key,label,val)=>`<label class="modal-field"><span>${e(t(label))}</span><input name="${key}" required type="number" min="0" max="10000000000" step="any" value="${e(val)}"></label>`;
 d.innerHTML=`<div class="dialog-header"><div><div class="eyebrow">KERDEX / ${e(t('navInvestments'))}</div><h2 id="asset-dialog-label">${e(t(id?'investEdit':'investAdd'))}</h2></div><button type="button" class="dialog-close" data-asset-close>${ico('close')}</button></div><form id="asset-form" data-id="${item.id}"><div class="modal-grid"><label class="modal-field"><span>${e(t('investSymbol'))}</span><input name="ticker" maxlength="22" required pattern="[A-Za-z0-9.\\-^: ]{1,22}" value="${e(item.ticker)}"></label><label class="modal-field"><span>${e(t('name'))}</span><input name="name" maxlength="110" required value="${e(item.name)}"></label><label class="modal-field"><span>${e(t('investType'))}</span><select name="type">${I.TYPE.map(x=>`<option value="${x}" ${x===item.type?'selected':''}>${e(t('asset'+x))}</option>`).join('')}</select></label><label class="modal-field"><span>${e(t('investCurrency'))}</span><select name="currency">${I.CCY.map(x=>`<option value="${x}" ${x===item.currency?'selected':''}>${x}</option>`).join('')}</select></label>${field('quantity','investQty',item.quantity)}${field('avgCost','investAvg',item.avgCost)}${field('price','investPrice',item.price)}${field('fx','investFx',item.fx)}${field('purchaseFx','investPurchaseFx',item.purchaseFx??item.fx)}${field('dividends','investDiv',item.dividends)}</div><p class="muted-small">${e(t('investWarning'))}</p><div id="asset-error" class="sim-error" role="alert"></div><div class="modal-actions"><button class="button button-secondary" type="button" data-asset-close>${e(t('cancel'))}</button><button class="button button-primary" type="submit">${e(t('investSave'))}</button></div></form>`;
 d.setAttribute('aria-labelledby','asset-dialog-label');d.showModal();
}
function saveAsset(ev){if(ev.target.id!=='asset-form')return;ev.preventDefault();const f=new FormData(ev.target),oldId=Number(ev.target.dataset.id);const data={id:oldId||Date.now(),name:String(f.get('name')).trim(),ticker:String(f.get('ticker')).trim().toUpperCase(),type:String(f.get('type')),currency:String(f.get('currency'))};
 for(const k of ['quantity','avgCost','price','fx','purchaseFx','dividends'])data[k]=Number(f.get(k));
 if(!I.validate(data)){document.getElementById('asset-error').textContent=t('simError');return;}
 if(oldId){const i=s.portfolio.findIndex(x=>x.id===oldId);if(i<0)return;s.portfolio[i]=data;}else s.portfolio.push(data);
 save();closeDialog();KX.Features.renderApp();KX.Features.toast(t('portfolioSaved'));
}
function afterRender(page){
 if(page==='news'&&!newsItems.length&&!newsLoading&&!newsError)fetchNews();
 if(page==='investments'){const input=document.getElementById('invest-search');if(input&&investQuery)input.setSelectionRange(investQuery.length,investQuery.length);}
}
async function fetchNews(){newsLoading=true;try{const response=await fetch('/api/news',{headers:{'Accept':'application/json'},cache:'no-store',signal:AbortSignal.timeout(12000)});
 if(!response.ok||!(response.headers.get('content-type')||'').includes('application/json'))throw Error('news source unavailable');
 const data=await response.json();if(!Array.isArray(data.items))throw Error('invalid news data');
 newsItems=data.items.filter(x=>x&&typeof x.title==='string'&&typeof x.source==='string'&&typeof x.url==='string'&&/^https:\/\//.test(x.url)).slice(0,70);
 newsLoadedAt=data.fetchedAt||Date.now();newsError=!newsItems.length;
 }catch(err){newsError=true;newsItems=[];newsLoadedAt=null;console.info('KERDEX News: no licensed feed available in this runtime',String(err).slice(0,100));}
 finally{newsLoading=false;if(s.page==='news')KX.Features.renderApp();}
}
async function fetchFx(){
 const input=document.querySelector('#advanced-sim select[name="currency"]');const base=input?.value;
 if(!base||base==='BRL')return;
 const out=document.querySelector('#advanced-sim-error');
 try{
   const res=await fetch('/api/fx?base='+encodeURIComponent(base),{headers:{Accept:'application/json'},signal:AbortSignal.timeout(7000)});
   if(!res.ok||!(res.headers.get('content-type')||'').includes('application/json'))throw Error('unavailable');
   const body=await res.json();if(body.base!==base||body.quote!=='BRL'||!Number.isFinite(body.rate)||body.rate<=0)throw Error('invalid');
   const field=document.querySelector('#advanced-sim [name="rateFx"]');if(field){field.value=String(body.rate);simParams.rateFx=body.rate;}
   if(out){out.hidden=false;out.style.color='var(--positive)';out.textContent=t('simFxLoaded')+': '+body.rate+' BRL · '+(body.date||'')+' · '+body.source;}
 }catch{
   if(out){out.hidden=false;out.style.color='var(--negative)';out.textContent=t('simFxUnavailable');}
 }
}
function handleClick(ev){
 const a=ev.target.closest('[data-inv-add]');if(a){showAsset(null);return true;}
 const ed=ev.target.closest('[data-inv-edit]');if(ed){showAsset(Number(ed.dataset.invEdit));return true;}
 const del=ev.target.closest('[data-inv-delete]');if(del){if(confirm(t('confirmDelete'))){s.portfolio=s.portfolio.filter(x=>x.id!==Number(del.dataset.invDelete));save();KX.Features.renderApp();KX.Features.toast(t('portfolioRemoved'))}return true;}
 if(ev.target.closest('[data-fx-fetch]')){fetchFx();return true;}
 if(ev.target.closest('[data-inv-export]')){KX.Exports.portfolio(s.portfolio,s.locale);return true;}
 if(ev.target.closest('[data-news-refresh]')){newsError=false;newsItems=[];fetchNews();KX.Features.renderApp();return true;}
 const filter=ev.target.closest('[data-news-filter]');if(filter){newsFilter=filter.dataset.newsFilter;KX.Features.renderApp();return true;}
 const xp=ev.target.closest('[data-sim-export]');if(xp){KX.Exports.report(xp.dataset.simExport,simResult,s.locale);KX.Features.toast(t('downloadReady'));return true;}
 return false;
}
function handleChange(ev){
 if(ev.target.id==='sim-mode'){simParams.mode=ev.target.value;simResult=null;KX.Features.renderApp();return true;}
 if(ev.target.matches('[data-news-topic]')){const k=ev.target.dataset.newsTopic;newsTopics=ev.target.checked?[...new Set([...newsTopics,k])]:newsTopics.filter(x=>x!==k);save();KX.Features.renderApp();KX.Features.toast(t('newsTopicsSaved'));return true;}
 return false;
}
function handleSubmit(ev){
 if(ev.target.id!=='advanced-sim')return false;
 ev.preventDefault();const f=new FormData(ev.target);
 try{
  const v={...simParams};for(const k of ['principal','monthly','target','months','annual','inflation','fee','tax','rateFx','extra'])if(f.has(k))v[k]=Number(f.get(k));
  v.currency=String(f.get('currency'));v.mode=String(f.get('mode'));v.schedule=String(f.get('schedule')||v.schedule);if(v.currency==='BRL')v.rateFx=1;
  simResult=Sim.calculate(v);simParams=v;KX.Features.renderApp();
 }catch(err){const output=document.getElementById('advanced-sim-error');if(output){output.hidden=false;output.textContent=t('simError');}console.info('Simulation validation:',err.message);}
 return true;
}
function handleInput(ev){if(ev.target.id==='invest-search'){
 investQuery=ev.target.value;const parent=document.querySelector('.investments-page');
 // Re-render on demand (name search) while preserving keyboard focus/caret.
 if(parent){const caret=ev.target.selectionStart;KX.Features.renderApp();const input=document.getElementById('invest-search');input?.focus();input?.setSelectionRange(caret,caret);}
 }}
document.getElementById('app').addEventListener('input',handleInput);
KX.Features={investments,news,simulator,afterRender,handleClick,handleChange,handleSubmit,renderApp:()=>{},toast:()=>{},persist:save};
})();

const labelFor=key=>t(key).replace(/<[^>]*>/g,'');
function metric(label,cents,kind='neutral',sub=''){
  return U.card(`<div class="metric-label">${e(label)}</div><div class="metric-value ${kind}">${money(cents)}</div>${sub?`<div class="metric-caption">${e(sub)}</div>`:''}`,'metric-card');
}
function monthSelector(){
  const opts=Array.from({length:13},(_,i)=>F.monthShift(F.monthKey(new Date()),-i));
  if(!opts.includes(s.month))opts.push(s.month);
  return `<label class="period-control">${icon('calendar',16)}<span class="sr-only">${e(t('period'))}</span><select id="month-select" aria-label="${e(t('period'))}">${opts.map(key=>`<option value="${key}" ${key===s.month?'selected':''}>${e(F.monthLabel(key,s.locale))}</option>`).join('')}</select>${icon('chevron',14)}</label>`;
}

}

function bottomBar(){
  const basic=[['overview','grid','navOverview'],['finance','wallet','navFinance'],['purchases','bag','navPurchases'],['goals','target','navGoals']];
  return `<nav class="bottom-nav" aria-label="${e(t('navHome'))}">${basic.map(([p,ic,k])=>`<button data-page="${p}" type="button" class="bottom-item ${s.page===p?'selected':''}" ${s.page===p?'aria-current="page"':''}>${icon(ic,20)}<span>${e(t(k))}</span></button>`).join('')}<button type="button" data-action="mobile-more" aria-expanded="${s.menuOpen?'true':'false'}" class="bottom-item ${['home','investments','news','simulator','settings'].includes(s.page)?'selected':''}">${icon('menu',20)}<span>${e(t('navMore'))}</span></button></nav>${s.menuOpen?`<div class="mobile-more-menu"><button type="button" data-page="home">${icon('home',18)}${e(t('navHome'))}</button><button type="button" data-page="investments">${icon('chart',18)}${e(t('navInvestments'))}</button><button type="button" data-page="news">${icon('book',18)}${e(t('navNews'))}</button><button type="button" data-page="simulator">${icon('calculator',18)}${e(t('navSimulator'))}</button><button type="button" data-page="settings">${icon('settings',18)}${e(t('navSettings'))}</button></div>`:''}`;
}
function transactionRow(row,canEdit=false){
  const sign=row.type==='income'?'+':'−';
  const img=row.type==='income'?'trending':'wallet';
  return `<div class="transaction-row"><div class="transaction-icon ${row.type}">${icon(img,19)}</div><div class="transaction-info"><strong>${e(KX.localizeDemoName(row.name,s.locale))}</strong><span>${e(t(row.category))} <span aria-hidden="true">·</span> ${e(F.dateLabel(row.date,s.locale))}</span></div><div class="transaction-end"><strong class="${row.type==='income'?'positive':'negative'}">${sign} ${money(row.cents)}</strong>${canEdit?`<div class="row-actions"><button type="button" data-edit="transaction:${row.id}" aria-label="${e(t('edit'))}: ${e(KX.localizeDemoName(row.name,s.locale))}" title="${e(t('edit'))}">${icon('edit',16)}</button><button type="button" data-delete="transaction:${row.id}" aria-label="${e(t('delete'))}: ${e(KX.localizeDemoName(row.name,s.locale))}" title="${e(t('delete'))}">${icon('trash',16)}</button></div>`:''}</div></div>`;
}
function goalCard(g){
  const p=F.progress(g.saved,g.cents);
  return `<article class="card item-card"><div class="item-top"><div class="item-icon goal-icon">${icon('target',20)}</div><div class="item-actions"><span class="priority priority-${g.priority||'medium'}">${e(t('priority'+(g.priority||'medium')[0].toUpperCase()+(g.priority||'medium').slice(1)))}</span><button type="button" data-edit="goal:${g.id}" aria-label="${e(t('edit'))}: ${e(KX.localizeDemoName(g.name,s.locale))}">${icon('edit',17)}</button><button type="button" data-delete="goal:${g.id}" aria-label="${e(t('delete'))}: ${e(KX.localizeDemoName(g.name,s.locale))}">${icon('trash',17)}</button></div></div><h3>${e(KX.localizeDemoName(g.name,s.locale))}</h3><div class="goal-money"><strong>${money(g.saved)}</strong><span>/ ${money(g.cents)}</span></div>${U.progress(g.saved,g.cents,true)}<div class="progress-caption"><span>${e(t('progress'))}</span><strong>${p}% ${p===100?`· ${e(t('completed'))}`:''}</strong></div></article>`;
}
function purchaseCard(p){
  const remaining=Math.max(0,p.cents-p.saved),months=F.monthsToGoal(p.saved,p.cents,p.monthly),date=F.projectedLabel(p.saved,p.cents,p.monthly,s.locale);
  const monthlyCash=F.totals(s.transactions,s.month).net;
  let impact=monthlyCash>0?`${Math.round(p.monthly/monthlyCash*100)}%`:t('noPositiveBudget');
  return `<article class="card purchase-card"><div class="item-top"><div class="item-icon bag-icon">${icon('bag',20)}</div><div class="item-actions"><span class="priority priority-${p.priority}">${e(t('priority'+p.priority[0].toUpperCase()+p.priority.slice(1)))}</span><button type="button" data-edit="purchase:${p.id}" aria-label="${e(t('edit'))}: ${e(KX.localizeDemoName(p.name,s.locale))}">${icon('edit',16)}</button><button type="button" data-delete="purchase:${p.id}" aria-label="${e(t('delete'))}: ${e(KX.localizeDemoName(p.name,s.locale))}">${icon('trash',16)}</button></div></div><h3>${e(KX.localizeDemoName(p.name,s.locale))}</h3><div class="purchase-price">${money(p.cents)}</div>${U.progress(p.saved,p.cents)}<div class="purchase-divider"></div><div class="purchase-facts"><span>${e(t('remaining'))}</span><strong>${money(remaining)}</strong><span>${e(t('monthlyContribution'))}</span><strong>${money(p.monthly)}</strong><span>${e(t('deadline'))}</span><strong>${date?e(date):e(t('notPossible'))}</strong></div><div class="purchase-estimate">${icon('info',15)}<span>${e(t('budgetImpact'))}: <strong>${e(impact)}</strong></span></div></article>`;
}
function trendChart(){
  const history=F.history(s.transactions,s.month,6),max=Math.max(1,...history.flatMap(m=>[m.income,m.expense]));
  const content=history.map(d=>`<div class="chart-group" title="${e(F.monthLabel(d.key,s.locale))}"><div class="chart-bars"><div class="chart-bar bar-income" data-height="${(d.income/max*100).toFixed(2)}"></div><div class="chart-bar bar-expense" data-height="${(d.expense/max*100).toFixed(2)}"></div></div><small>${e(F.monthLabel(d.key,s.locale,true))}</small></div>`).join('');
  return U.card(`${U.sectionHead(t('monthlyTrend'),U.badge(t('demoShort')))}<div class="chart-area" role="img" aria-label="${e(t('chartAlt'))}">${content}</div><div class="chart-legend"><span><i class="legend-dot income-dot"></i>${e(t('income'))}</span><span><i class="legend-dot expense-dot"></i>${e(t('expenses'))}</span></div><div class="sr-only chart-data-accessible"><table><caption>${e(t('chartAlt'))}</caption><thead><tr><th>${e(t('period'))}</th><th>${e(t('income'))}</th><th>${e(t('expenses'))}</th></tr></thead><tbody>${history.map(x=>`<tr><th>${e(F.monthLabel(x.key,s.locale))}</th><td>${money(x.income)}</td><td>${money(x.expense)}</td></tr>`).join('')}</tbody></table></div>`,'chart-card');
}
function progressOverview(){
  return U.card(`${U.sectionHead(t('goalsPreview'),U.link(t('viewAll'),'goals'))}${s.goals.slice(0,3).map(g=>`<div class="compact-goal"><div class="compact-line"><span>${e(KX.localizeDemoName(g.name,s.locale))}</span><strong>${F.progress(g.saved,g.cents)}%</strong></div>${U.progress(g.saved,g.cents,true)}<small>${money(g.saved)} / ${money(g.cents)}</small></div>`).join('')||U.empty(t('emptyGoals'))}`,'goals-card');
}
function recentTransactions(){
  const rows=s.transactions.filter(x=>x.date.startsWith(s.month)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  return U.card(`${U.sectionHead(t('recent'),U.link(t('viewAll'),'finance'))}<div class="transaction-list">${rows.map(x=>transactionRow(x)).join('')||U.empty(t('emptyTransactions'))}</div>`,'recent-card');
}
function cashflowTeaser(){
  const m=F.totals(s.transactions,s.month),max=Math.max(m.income,m.expense,1);
  return U.card(`${U.sectionHead(t('cashflow'))}<div class="cashflow-bars"><div class="cashflow-line"><div class="cashflow-label"><span>${e(t('income'))}</span><strong>${money(m.income)}</strong></div><div class="cashflow-track"><span class="cashflow-fill positive-bg" data-progress="${(m.income/max*100).toFixed(2)}"></span></div></div><div class="cashflow-line"><div class="cashflow-label"><span>${e(t('expenses'))}</span><strong>${money(m.expense)}</strong></div><div class="cashflow-track"><span class="cashflow-fill lime-bg" data-progress="${(m.expense/max*100).toFixed(2)}"></span></div></div><div class="result-band"><span>${e(t('netFlow'))}</span><strong class="${m.net>=0?'positive':'negative'}">${money(m.net)}</strong></div></div>`,'cashflow-card');
}
function overview(){
  const m=F.totals(s.transactions,s.month);const actions=U.button(t('addTransaction'),'create-transaction','primary','plus');
  const cards=`<div class="metric-grid">${metric(t('income'),m.income,'positive',F.monthLabel(s.month,s.locale))}${metric(t('expenses'),m.expense,'neutral',F.monthLabel(s.month,s.locale))}${metric(t('netFlow'),m.net,m.net>=0?'positive':'negative',t('netFlowInfo'))}</div>`;
  return `${U.head('KERDEX / '+t('navOverview'),t('overviewGreeting'),t('overviewSubtitle'),`${monthSelector()}${actions}`)}<div class="welcome-strip"><div class="welcome-orbit">${icon('sparkle',17)}<span>${e(t('tagline'))}</span></div><div>${e(t('demoWarning'))}</div></div>${cards}<div class="dashboard-main">${s.widgets.trend?trendChart():cashflowTeaser()}${s.widgets.goals?progressOverview():cashflowTeaser()}</div><div class="dashboard-lower">${s.widgets.recent?recentTransactions():cashflowTeaser()}${U.card(`${U.sectionHead(t('quickActions'))}<p class="quick-copy">${e(t('actionTip'))}</p><div class="quick-button-grid"><button data-action="create-transaction">${icon('wallet',20)}<span>${e(t('addTransaction'))}</span>${icon('arrow',17)}</button><button data-action="create-purchase">${icon('bag',20)}<span>${e(t('addPurchase'))}</span>${icon('arrow',17)}</button><button data-action="create-goal">${icon('target',20)}<span>${e(t('addGoal'))}</span>${icon('arrow',17)}</button><button data-page="simulator">${icon('calculator',20)}<span>${e(t('navSimulator'))}</span>${icon('arrow',17)}</button></div>`,'quick-card')}</div>`;
}

function finance(){
  const m=F.totals(s.transactions,s.month);
  const list=s.transactions.filter(x=>x.date.startsWith(s.month)).filter(x=>s.financeType==='all'||x.type===s.financeType).filter(x=>`${x.name} ${t(x.category)}`.toLocaleLowerCase(s.locale).includes(s.financeQuery.toLocaleLowerCase(s.locale))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const c=F.categoryTotals(s.transactions,s.month),total=c.reduce((acc,x)=>acc+x.cents,0);
  return `${U.head('KERDEX / '+t('navFinance'),t('financeTitle'),t('financeSubtitle'),`${monthSelector()}${U.button(t('addTransaction'),'create-transaction','primary','plus')}`)}<div class="metric-grid">${metric(t('income'),m.income,'positive')}${metric(t('expenses'),m.expense,'neutral')}${metric(t('netFlow'),m.net,m.net>=0?'positive':'negative',t('netFlowInfo'))}</div><div class="finance-layout">${U.card(`${U.sectionHead(t('transactions'),U.badge(String(list.length)))}<div class="filter-row"><label class="search-wrap">${icon('filter',17)}<span class="sr-only">${e(t('search'))}</span><input id="finance-search" type="search" value="${e(s.financeQuery)}" placeholder="${e(t('searchPlaceholder'))}" maxlength="80"></label><label class="filter-select"><span class="sr-only">${e(t('filterType'))}</span><select id="finance-type"><option value="all" ${s.financeType==='all'?'selected':''}>${e(t('allTypes'))}</option><option value="expense" ${s.financeType==='expense'?'selected':''}>${e(t('expense'))}</option><option value="income" ${s.financeType==='income'?'selected':''}>${e(t('incomeSingular'))}</option></select>${icon('chevron',15)}</label></div><div id="finance-results" class="transaction-list">${list.length?list.map(x=>transactionRow(x,true)).join(''):U.empty(t('emptyGeneric'))}</div>`,'finance-list')}${U.card(`${U.sectionHead(t('topExpenses'))}<div class="category-list">${c.length?c.slice(0,5).map(x=>`<div class="category-row"><div class="category-top"><span>${e(t(x.category))}</span><strong>${money(x.cents)}</strong></div><div class="category-track"><span data-progress="${(x.cents/Math.max(total,1)*100).toFixed(2)}"></span></div></div>`).join(''):U.empty(t('emptyTransactions'))}</div>`,'category-card')}</div>`;
}
function purchases(){
  const all=s.purchases,tc=all.reduce((a,x)=>a+x.cents,0),saved=all.reduce((a,x)=>a+x.saved,0);
  return `${U.head('KERDEX / '+t('navPurchases'),t('purchaseTitle'),t('purchaseSubtitle'),U.button(t('addPurchase'),'create-purchase','primary','plus'))}<div class="metric-grid"><section class="card metric-card"><div class="metric-label">${e(t('wishCount'))}</div><div class="metric-value">${all.length}</div></section>${metric(t('totalPlanned'),tc)}${metric(t('reservedTotal'),saved,'positive')}</div><div class="items-grid">${all.length?all.map(purchaseCard).join(''):U.empty(t('emptyPurchases'),U.button(t('addPurchase'),'create-purchase','secondary','plus'))}</div>`;
}
function goals(){return `${U.head('KERDEX / '+t('navGoals'),t('goalsTitle'),t('goalsSubtitle'),U.button(t('addGoal'),'create-goal','primary','plus'))}<div class="goals-intro"><div class="intro-icon">${icon('target',24)}</div><div><strong>${s.goals.length} ${e(t('goalCount')).toLocaleLowerCase(s.locale)}</strong><p>${e(t('sideMicro'))}</p></div></div><div class="items-grid">${s.goals.length?s.goals.map(goalCard).join(''):U.empty(t('emptyGoals'),U.button(t('addGoal'),'create-goal','secondary','plus'))}</div>`;}
function simulator(){
  return `${U.head('KERDEX / '+t('navSimulator'),t('simTitle'),t('simSubtitle'))}<div class="simulation-layout">${U.card(`<div class="section-head"><h2>${e(t('simResult'))}</h2>${U.badge(t('demoShort'))}</div><form id="calculator-form" class="calculator-form"><label>${e(t('simTarget'))}<input name="target" type="number" required min="0.01" max="1000000000" step="0.01" inputmode="decimal" value="7500.00"></label><label>${e(t('simSaved'))}<input name="saved" type="number" required min="0" max="1000000000" step="0.01" inputmode="decimal" value="1500.00"></label><label>${e(t('simMonthly'))}<input name="monthly" type="number" required min="0" max="1000000000" step="0.01" inputmode="decimal" value="500.00"></label><button type="submit" class="button button-primary">${icon('calculator',17)} ${e(t('calc'))}</button></form>`,'calculator-card')}<div id="calculator-result" class="calculator-result" aria-live="polite">${buildSimulation(750000,150000,50000)}</div></div>`;
}
function buildSimulation(target,saved,monthly){
  const remaining=Math.max(0,target-saved),months=F.monthsToGoal(saved,target,monthly),date=F.projectedLabel(saved,target,monthly,s.locale);
  return `<div class="sim-result-head">${icon('sparkle',21)}<span>${e(t('simResult'))}</span></div><div class="sim-primary">${months===null?'—':months===0?'0':months}<span>${e(t('monthUnit'))}</span></div><p>${months===null?e(t('simNever')):months===0?e(t('simToday')):`${e(t('simUntil'))}: <strong>${e(date)}</strong>`}</p><div class="sim-mini"><span>${e(t('simCost'))}</span><strong>${money(remaining)}</strong></div>${U.progress(saved,target)}<div class="sim-notice">${icon('info',18)}<span>${e(t('simNoInterest'))}</span></div>`;
}
function toggleSetting(key,label,checked){return `<label class="toggle-line"><span>${e(label)}</span><input type="checkbox" data-setting="${key}" role="switch" ${checked?'checked':''}><span class="switch" aria-hidden="true"></span></label>`;}
function settings(){

}

function render(){
  document.documentElement.lang=s.locale;
  document.documentElement.dataset.theme=s.theme;
  document.documentElement.classList.toggle('compact-ui',s.compact);
  document.title=`KERDEX — ${t((NAV.find(x=>x[0]===s.page)||['home',0,'navHome'])[2])}`;
  const content=({home,overview,finance,purchases,goals,simulator:KX.Features.simulator,investments:KX.Features.investments,news:KX.Features.news,settings}[s.page]||home)();
  root.innerHTML=`<div class="app-shell">${sidebar()}<div class="main-column">${topBar()}<main id="main-content" tabindex="-1" class="main-content ${s.page==='home'?'home-main':''}">${content}${footer()}</main></div></div>${bottomBar()}`;
  applyFillLevels();KX.Features.afterRender(s.page);
}
function applyFillLevels(){
  // Setting CSS properties from bounded numeric data does not require unsafe inline HTML.
  root.querySelectorAll('[data-progress]').forEach(el=>{el.style.width=`${Math.max(0,Math.min(100,Number(el.dataset.progress)||0))}%`;});
  root.querySelectorAll('[data-height]').forEach(el=>{el.style.height=`${Math.max(2,Math.min(100,Number(el.dataset.height)||0))}%`;});
}
KX.Features.renderApp=render;KX.Features.toast=announce;
function announce(message){toastNode.textContent=message;toastNode.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastNode.classList.remove('visible'),3400);}
function navigate(page){
  if(!['home','overview','finance','purchases','goals','investments','news','simulator','settings'].includes(page))return;
  s.page=page;s.menuOpen=false;
  if(location.hash!==`#${page}`)history.pushState(null,'',`#${page}`);
  render();scrollTo({top:0,behavior:'instant'});
}
function openForm(kind,id=null){
  const collection={transaction:'transactions',purchase:'purchases',goal:'goals'}[kind];
  if(!collection)return;
  const item=id===null?null:s[collection].find(x=>x.id===id);
  if(id!==null&&!item)return;
  const heading=t((item?'edit':'new')+kind[0].toUpperCase()+kind.slice(1));
  const field=(key,label,value,extra='')=>`<label class="modal-field"><span>${e(label)}</span><input name="${key}" ${extra} value="${e(value)}"></label>`;
  const num=(key,label,value,required=true)=>field(key,label,F.inputAmount(value),`type="number" min="${required?'.01':'0'}" max="1000000000" step="0.01" inputmode="decimal" required`);
  let fields=field('name',t('name'),item?.name||'',`type="text" required maxlength="80" autocomplete="off"`);
  fields+=num('amount',kind==='purchase'?t('price'):kind==='goal'?t('target'):t('amount'),item?.cents||0);
  if(kind==='transaction'){
    fields+=`<label class="modal-field"><span>${e(t('type'))}</span><select name="type"><option value="expense" ${item?.type!=='income'?'selected':''}>${e(t('expense'))}</option><option value="income" ${item?.type==='income'?'selected':''}>${e(t('incomeSingular'))}</option></select></label>`;
    fields+=`<label class="modal-field"><span>${e(t('category'))}</span><select name="category">${['work','housing','food','transport','health','leisure','other'].map(k=>`<option value="${k}" ${item?.category===(k)?'selected':''}>${e(t(k))}</option>`).join('')}</select></label>`;
    fields+=field('date',t('date'),item?.date||F.dateISO(new Date()),'type="date" required');
  } else {
    fields+=num('saved',t('saved'),item?.saved||0,false);
    if(kind==='purchase'){
      fields+=num('monthly',t('monthlyContribution'),item?.monthly??30000,false);
      fields+=`<label class="modal-field"><span>${e(t('purchasePriority'))}</span><select name="priority">${['high','medium','low'].map(k=>`<option value="${k}" ${item?.priority===k?'selected':''}>${e(t('priority'+k[0].toUpperCase()+k.slice(1)))}</option>`).join('')}</select></label>`;
    }
    if(kind==='goal')fields+=`<label class="modal-field"><span>${e(t('purchasePriority'))}</span><select name="priority">${['high','medium','low'].map(k=>`<option value="${k}" ${(item?.priority||'medium')===k?'selected':''}>${e(t('priority'+k[0].toUpperCase()+k.slice(1)))}</option>`).join('')}</select></label>`;
  }
  dialogContent.innerHTML=`<div class="dialog-header"><div><div class="eyebrow">KERDEX · ${e(t('demoShort'))}</div><h2 id="dialog-heading">${e(heading)}</h2></div><button class="dialog-close" type="button" data-dialog-close aria-label="${e(t('close'))}">${icon('close',20)}</button></div><form id="entry-form" data-kind="${kind}" data-id="${item?.id??''}"><div class="modal-grid">${fields}</div><div id="modal-error" class="form-error" role="alert"></div><div class="modal-actions"><button class="button button-secondary" type="button" data-dialog-close>${e(t('cancel'))}</button><button class="button button-primary" type="submit">${icon('check',17)}${e(t('save'))}</button></div></form><p class="modal-footnote">${icon('shield',15)} ${e(t('demoWarning'))}</p>`;
  dialog.showModal();
}
function validateAndSave(form){
  const kind=form.dataset.kind,id=form.dataset.id?Number(form.dataset.id):null;
  const data=new FormData(form),name=String(data.get('name')||'').trim();
  const amount=F.parseCents(data.get('amount'));
  const saved=F.parseCents(data.get('saved')??'0');
  const monthly=F.parseCents(data.get('monthly')??'0');
  let error=null;
  if(!name||name.length>80)error=t('errorName');
  else if(amount===null||amount<=0)error=t('errorAmount');
  else if(saved===null||saved>amount)error=t('errorSaved');
  else if(monthly===null)error=t('errorMonthly');
  const item={name,cents:amount};
  if(kind==='transaction'){
    item.type=String(data.get('type'));
    item.category=String(data.get('category'));
    item.date=String(data.get('date'));
    if(!['income','expense'].includes(item.type)||!['work','housing','food','transport','health','leisure','other'].includes(item.category)||!F.validateDate(item.date))error=t('errorInvalid');
    if(!error)s.month=item.date.slice(0,7);
  }else if(kind==='purchase'){
    item.saved=saved;item.monthly=monthly;item.priority=String(data.get('priority'));
    if(!['high','medium','low'].includes(item.priority))error=t('errorInvalid');
  }else if(kind==='goal'){item.saved=saved;item.priority=String(data.get('priority')||'medium');if(!['high','medium','low'].includes(item.priority))error=t('errorInvalid');}
  else error=t('errorInvalid');
  if(error){document.getElementById('modal-error').textContent=error;return;}
  if(id===null)S.add(kind,item);else S.update(kind,id,item);
  dialog.close();render();announce(t('savedSuccessfully'));
}
root.addEventListener('click',ev=>{
  const page=ev.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}
  const scroll=ev.target.closest('[data-scroll]');if(scroll){document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(KX.Features.handleClick(ev))return;
  const action=ev.target.closest('[data-action]');
  if(action){const a=action.dataset.action;
    if(a.startsWith('create-'))openForm(a.slice(7));
    else if(a==='go-overview')navigate('overview');
    else if(a==='mobile-more'){s.menuOpen=!s.menuOpen;render();}
    else if(a==='reset-demo'&&confirm(t('resetConfirm'))){S.reset();s.month=F.monthKey(new Date());render();announce(t('resetToast'));}
    return;
  }
  const edit=ev.target.closest('[data-edit]');if(edit){const [kind,id]=edit.dataset.edit.split(':');openForm(kind,Number(id));return;}
  const del=ev.target.closest('[data-delete]');if(del){const [kind,id]=del.dataset.delete.split(':');if(confirm(t('confirmDelete'))){S.remove(kind,Number(id));render();announce(t('deletedSuccessfully'));}return;}
  const theme=ev.target.closest('[data-theme]');if(theme){s.theme=theme.dataset.theme;S.persist();render();}
});
root.addEventListener('change',ev=>{if(KX.Features.handleChange(ev))return;
  if(ev.target.id==='lang-top'||ev.target.id==='locale-preference'){s.locale=ev.target.value;S.persist();render();announce(t('toastLanguage'));}
  if(ev.target.id==='month-select'){s.month=ev.target.value;render();}
  if(ev.target.id==='finance-type'){s.financeType=ev.target.value;render();}
  if(ev.target.matches('[data-setting]')){
    const key=ev.target.dataset.setting;
    if(key==='remember')s.remember=ev.target.checked;
    else if(key==='compact')s.compact=ev.target.checked;
    else if(['trend','goals','recent'].includes(key))s.widgets[key]=ev.target.checked;
    S.persist();render();
  }
});
root.addEventListener('input',ev=>{
  if(ev.target.id==='finance-search'){
    const cursor=ev.target.selectionStart;
    s.financeQuery=ev.target.value;
    const parent=ev.target.closest('.finance-list');
    if(!parent)return;
    const matches=s.transactions.filter(x=>x.date.startsWith(s.month)).filter(x=>s.financeType==='all'||x.type===s.financeType).filter(x=>`${x.name} ${t(x.category)}`.toLocaleLowerCase(s.locale).includes(s.financeQuery.toLocaleLowerCase(s.locale))).sort((a,b)=>b.date.localeCompare(a.date));
    parent.querySelector('#finance-results').innerHTML=matches.length?matches.map(x=>transactionRow(x,true)).join(''):U.empty(t('emptyGeneric'));
    ev.target.setSelectionRange(cursor,cursor);
  }
});
root.addEventListener('submit',ev=>{if(KX.Features.handleSubmit(ev))return;
  if(ev.target.id==='calculator-form'){
    ev.preventDefault();
    const d=new FormData(ev.target),target=F.parseCents(d.get('target')),saved=F.parseCents(d.get('saved')),monthly=F.parseCents(d.get('monthly'));
    const el=document.getElementById('calculator-result');
    if([target,saved,monthly].some(v=>v===null)||target<=0||saved>target){el.textContent=t('errorInvalid');return;}
    el.innerHTML=buildSimulation(target,saved,monthly);applyFillLevels();
  }
});
dialog.addEventListener('click',ev=>{if(ev.target.closest('[data-dialog-close]'))dialog.close();});
dialog.addEventListener('submit',ev=>{if(ev.target.id==='entry-form'){ev.preventDefault();validateAndSave(ev.target);}});
window.addEventListener('popstate',()=>{const hash=location.hash.slice(1);s.page=['home','overview','finance','purchases','goals','investments','news','simulator','settings'].includes(hash)?hash:'home';render();});
window.addEventListener('hashchange',()=>{const hash=location.hash.slice(1);if(['home','overview','finance','purchases','goals','investments','news','simulator','settings'].includes(hash)&&s.page!==hash){s.page=hash;render();}});
const initial=location.hash.slice(1);if(['home','overview','finance','purchases','goals','investments','news','simulator','settings'].includes(initial))s.page=initial;
render();
})();
</script></body>
</html>
